<title>SRM Site</title>
<style>
:root { --bg: #eef1f5; --card: #ffffff; --text: #131a23; --muted: #55606e; --line: #cdd5df; --accent: #0f4c81; --on-accent: #ffffff; --bad: #b3261e; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1318; --card: #19202a; --text: #e8ecf1; --muted: #a1abb8; --line: #2e3844; --accent: #8cc0ff; --on-accent: #06223f; --bad: #ff8a80; color-scheme: dark; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) 16px 24px; }
main { max-width: 26rem; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; }
h1 { font-size: 1.2rem; margin: 0; }
label { font-weight: 600; font-size: .95rem; }
input { font: inherit; width: 100%; padding: 10px 12px; min-height: 48px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
button { font: inherit; font-weight: 650; min-height: 52px; border-radius: 10px; border: 2px solid var(--accent); background: var(--accent); color: var(--on-accent); }
button:disabled { opacity: .45; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
#msg { margin: 0; min-height: 1.4em; color: var(--muted); }
#msg.bad { color: var(--bad); font-weight: 600; }
</style>
</head>
<body>
<main id="lock" hidden>
  <h1>SRM Site</h1>
  <form id="form" style="display:grid;gap:10px">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Open</button>
  </form>
  <p id="msg" role="status"></p>
</main>

const $ = id => document.getElementById(id);
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const db = () => new Promise((res, rej) => { const r = indexedDB.open("srm-lock", 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function keptKey() {
  try { const d = await db(); return await new Promise(res => { const q = d.transaction("k").objectStore("k").get(LOCKED.s); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); }
  catch (e) { return null; }
}
async function keepKey(key) {
  try { const d = await db(); const t = d.transaction("k", "readwrite"); t.objectStore("k").clear(); t.objectStore("k").put(key, LOCKED.s); await new Promise(res => { t.oncomplete = res; t.onerror = res; }); }
  catch (e) { /* it asks again next time */ }
}
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(LOCKED.s), iterations: LOCKED.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function decrypt(key) { return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(LOCKED.i) }, key, bytes(LOCKED.c))); }
function show(page) { document.open(); document.write(page); document.close(); }
function ask(text, bad) { $("lock").hidden = false; $("msg").textContent = text || ""; $("msg").className = bad ? "bad" : ""; $("go").disabled = false; }
(async () => {
  if (!window.crypto || !crypto.subtle) { ask("Open it from its https address.", true); return; }
  const key = await keptKey();
  if (key) { try { show(await decrypt(key)); return; } catch (e) { /* the page was locked again with another password */ } }
  ask();
  $("pw").focus();
})();
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("go").disabled = true; $("msg").className = ""; $("msg").textContent = "Opening…";
  let page;
  try { const key = await derive($("pw").value); page = await decrypt(key); await keepKey(key); }
  catch (x) { ask("That isn't the password.", true); $("pw").select(); return; }
  show(page);
});
})();
